[package]
name = "metallic"
version = "0.2.0"
authors = ["Chen-Pang He (https://jdh8.org)"]
edition = "2021"
description = "C math functions from scratch"
repository = "https://github.com/jdh8/metallic-rs"
license = "MIT"
categories = ["mathematics"]
keywords = ["floating-point", "trigonometry", "exponential", "logarithm", "special-functions"]
exclude = ["/tests/*/huge"]

[dependencies]
core-math = { version = "1.0.0", optional = true }
fast_polynomial = "0.3.0"

[dev-dependencies]
core-math = "1.0.0"
criterion = "0.7.0"
hexf-parse = "0.2.1"
libm = "0.2.15"
rand = "0.9.2"
regex = "1.11.1"

[features]
core-math = ["dep:core-math"]

[profile.dev]
opt-level = 3

[[bench]]
name = "f32_acos"
harness = false

[[bench]]
name = "f32_acosh"
harness = false


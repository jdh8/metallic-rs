[package]
name = "metallic"
version = "0.3.0-dev"
authors = ["Chen-Pang He (https://jdh8.org)"]
edition = "2024"
rust-version = "1.85"
description = "C math functions from scratch"
repository = "https://github.com/jdh8/metallic-rs"
license = "MIT"
categories = ["mathematics"]
keywords = ["floating-point", "trigonometry", "exponential", "logarithm", "special-functions"]
exclude = ["/tests/cases"]
autobenches = false

[package.metadata.docs.rs]
features = ["f128"]

[dependencies]
# `std` enables `num-traits`' `MulAdd for f64`, which `PolyNum` (used by
# `poly_array`/`rational_array`) requires; without it the library does not build
# on its own (only under `cargo test`, where dev-dependencies pull it in).
fast_polynomial = { version = "0.4", features = ["std"] }
# MPFR oracle used only by the corpus generators (`gen_f64_tgamma_cases`,
# `gen_f64_lgamma_cases`).  They freeze the hard-to-round cases into
# `tests/cases/*.wc`, which the default `cargo test` then checks with no oracle.
# Optional and gated behind the `mpfr` feature so neither the default test run
# nor the library build needs rug or a system MPFR/GMP build.
rug = { version = "1", optional = true }

[dev-dependencies]
core-math = "1.3"
criterion = "0.8"
hexf-parse = "0.2"
libm = "0.2"
rand = "0.10"
regex = "1"

[features]
mpfr = ["dep:rug"]
# Nightly-only: enabling this on stable intentionally fails with E0554.
f128 = ["core-math/f128", "rug?/nightly-float"]
_no_fma = []

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[lib]
# Prevents cargo bench from running the lib test harness as a benchmark target.
# This avoids errors when passing Criterion/bencher options like --output-format.
bench = false

# Generators for the hard-to-round corpora; need the MPFR oracle, so gate them
# behind `mpfr` to keep them out of the default build.
[[example]]
name = "gen_f64_compound_cases"
required-features = ["mpfr"]

[[example]]
name = "gen_f64_tgamma_cases"
required-features = ["mpfr"]

[[example]]
name = "gen_f64_lgamma_cases"
required-features = ["mpfr"]

[[example]]
name = "gen_f128_trig_cases"
required-features = ["f128", "mpfr"]


name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Enable FMA + AVX2 across the workflow so the "FMA" job matrix exercises the
  # real fast path. `x86-64-v3` is portable across all GitHub-hosted Ubuntu
  # runners, so a binary built in one job runs in every matrix shard.
  RUSTFLAGS: -Ctarget-cpu=x86-64-v3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.list }}
      tests_f128: ${{ steps.tests.outputs.f128 }}
    steps:
    - uses: actions/checkout@v6
    - name: Discover test targets
      id: tests
      shell: bash
      run: |
        list=$(basename -a -s .rs tests/all/f32_/*.rs tests/all/f64_/*.rs | jq -R -s -c 'split("\n")[:-1]')
        f128=$(basename -a -s .rs tests/all/f128_/*.rs | jq -R -s -c 'split("\n")[:-1]')
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "f128=$f128" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-${{ hashFiles('**/Cargo.lock') }}
    - name: Build test binaries
      run: cargo test --no-run --verbose

  build-nofma:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-nofma-${{ hashFiles('**/Cargo.lock') }}
    - name: Build test binaries forcing no-FMA fallback
      run: cargo test --no-run --features _no_fma --verbose

  build-f128:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      CC: clang
      TARGET_CPU: x86-64-v3
    steps:
    - uses: actions/checkout@v6
    - name: Install nightly Rust
      uses: dtolnay/rust-toolchain@nightly
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-f128-${{ hashFiles('**/Cargo.lock') }}
    - name: Build binary128 test binaries
      run: cargo +nightly test --no-run --features f128 --verbose

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust 1.85 (declared MSRV)
      uses: dtolnay/rust-toolchain@1.85
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: msrv
    # Verify the library compiles on the `rust-version` floor in Cargo.toml.
    # Only the library and its normal dependencies are subject to the MSRV;
    # dev-dependencies (criterion, etc.) may require newer Rust, so this builds
    # `--lib` rather than the test/bench harness. Both the FMA and `_no_fma`
    # code paths are checked.
    - name: Build library on MSRV
      run: cargo build --lib --verbose
    - name: Build library on MSRV forcing no-FMA fallback
      run: cargo build --lib --features _no_fma --verbose

  test:
    needs:
    - prepare
    - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.tests) }}
    steps:
    - uses: actions/checkout@v6
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-${{ hashFiles('**/Cargo.lock') }}
        save-if: false
    - name: Run tests
      run: cargo test --test all --verbose -- '::${{ matrix.test }}::'

  test-lib:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-${{ hashFiles('**/Cargo.lock') }}
        save-if: false
    - name: Run lib tests
      run: cargo test --lib --verbose

  test-f128:
    needs:
    - prepare
    - build-f128
    runs-on: ubuntu-24.04
    env:
      CC: clang
      TARGET_CPU: x86-64-v3
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.tests_f128) }}
    steps:
    - uses: actions/checkout@v6
    - name: Install nightly Rust
      uses: dtolnay/rust-toolchain@nightly
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-f128-${{ hashFiles('**/Cargo.lock') }}
        save-if: false
    - name: Run binary128 tests
      run: cargo +nightly test --test all --features f128 --verbose -- '::${{ matrix.test }}::'

  test-f128-lib:
    needs: build-f128
    runs-on: ubuntu-24.04
    env:
      CC: clang
      TARGET_CPU: x86-64-v3
    steps:
    - uses: actions/checkout@v6
    - name: Install nightly Rust
      uses: dtolnay/rust-toolchain@nightly
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-f128-${{ hashFiles('**/Cargo.lock') }}
        save-if: false
    - name: Run binary128 lib tests
      run: cargo +nightly test --lib --features f128 --verbose

  test-nofma:
    needs:
    - prepare
    - build-nofma
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.tests) }}
    steps:
    - uses: actions/checkout@v6
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-nofma-${{ hashFiles('**/Cargo.lock') }}
        save-if: false
    - name: Run tests forcing no-FMA fallback
      run: cargo test --test all --features _no_fma --verbose -- '::${{ matrix.test }}::'

  test-lib-nofma:
    needs: build-nofma
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test-nofma-${{ hashFiles('**/Cargo.lock') }}
        save-if: false
    - name: Run lib tests forcing no-FMA fallback
      run: cargo test --lib --features _no_fma --verbose

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check formatting
      run: cargo fmt --check

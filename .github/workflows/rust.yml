name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Enable FMA + AVX2 so the default build exercises the real fast path.
  # TARGET_CPU pins core-math-sys's C build to the same ISA level.
  RUSTFLAGS: -Ctarget-cpu=x86-64-v3
  TARGET_CPU: x86-64-v3

jobs:
  # `tests/all` links every integration test into one binary, so libtest
  # already runs them in parallel on the runner's cores; one job per feature
  # set replaces the old per-function shard matrix.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - features: ""
          toolchain: stable
        - features: _no_fma
          toolchain: stable
        - features: f128
          toolchain: nightly
    name: test (${{ matrix.features || 'default' }})
    env:
      # CORE-MATH's hypotq.c needs clang (__builtin_addcl); harmless elsewhere.
      CC: clang
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: test${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
    - name: Run tests
      run: cargo test --features "${{ matrix.features }}" --verbose

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust 1.85 (declared MSRV)
      uses: dtolnay/rust-toolchain@1.85
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: msrv
    # Verify the library compiles on the `rust-version` floor in Cargo.toml.
    # Only the library and its normal dependencies are subject to the MSRV;
    # dev-dependencies (criterion, etc.) may require newer Rust, so this builds
    # `--lib` rather than the test/bench harness. Both the FMA and `_no_fma`
    # code paths are checked.
    - name: Build library on MSRV
      run: cargo build --lib --verbose
    - name: Build library on MSRV forcing no-FMA fallback
      run: cargo build --lib --features _no_fma --verbose

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check formatting
      run: cargo fmt --check

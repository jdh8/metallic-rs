name: Benchmark
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  # `build` and each `bench` matrix job land on different GitHub-hosted runners
  # with heterogeneous CPUs, and `bench` reuses the cached binary from `build`.
  # `-Ctarget-cpu=native` would crash with SIGILL when the build host has newer
  # ISA extensions than the bench host. `x86-64-v3` (AVX2 + FMA) is supported by
  # every current GitHub-hosted Ubuntu runner and exercises metallic's FMA path.
  RUSTFLAGS: -Ctarget-cpu=x86-64-v3

defaults:
  run:
    # GHA's default `bash -e {0}` has no `pipefail`, so `cargo bench … | tee …`
    # would mask a crash: tee returns 0, the step is "successful", and an empty
    # artifact is uploaded. Force pipefail across the workflow.
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      benches: ${{ steps.benches.outputs.list }}
    steps:
    - uses: actions/checkout@v6

    - name: Discover bench targets
      id: benches
      run: |
        list=$(cargo metadata --no-deps --format-version 1 | jq -c '
          [.packages[0].targets[]
           | select(.kind == ["bench"] and (((.["required-features"] // []) | length) == 0))
           | .name]')
        echo "list=$list" >> "$GITHUB_OUTPUT"

  bench:
    needs:
    - prepare
    - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJson(needs.prepare.outputs.benches) }}
    steps:
    - uses: actions/checkout@v6

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: bench-${{ hashFiles('**/Cargo.lock') }}
        save-if: false

    - name: Run benchmark
      run: |
        out=bench-output-${{ matrix.bench }}.txt
        cargo bench --bench ${{ matrix.bench }} -- --output-format bencher | tee "$out"
        # Belt-and-braces: even if a future change re-loses pipefail, refuse to
        # upload an empty file that would silently drop this bench from the
        # published dataset.
        test -s "$out"

    - name: Upload benchmark output
      uses: actions/upload-artifact@v7
      with:
        name: bench-output-${{ matrix.bench }}
        path: bench-output-${{ matrix.bench }}.txt
        if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Build benchmark binaries
      run: cargo bench --no-run --benches

  publish:
    needs: bench
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        path: bench-outputs

    - name: Merge benchmark outputs
      run: |
        find bench-outputs -name 'bench-output-*.txt' -type f -print0 \
          | sort -z \
          | xargs -0 cat > bench-output.txt

    - name: Publish benchmark numbers
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: cargo
        output-file-path: bench-output.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        gh-pages-branch: gh-pages
        benchmark-data-dir-path: dev/bench
        alert-threshold: 200%
        comment-on-alert: false
        fail-on-alert: false
